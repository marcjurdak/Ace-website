<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ACE Admin</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Archivo:wdth,wght@100..125,300..700&display=swap" rel="stylesheet">
<script src="/content-defaults.js"></script>
<style>
:root{--bg:#F1F1F0;--fg:#0B0B0B;--surface:#fff;--surface2:#F7F7F6;--muted:#62625F;--line:rgba(0,0,0,.12);--studio:#C6C6C4;
  --ok:#1f7a3f;--okbg:rgba(31,122,63,.1);--warn:#9a6700;--warnbg:rgba(154,103,0,.1);--bad:#c0392b;--badbg:rgba(192,57,43,.1);--info:#1d4ed8;--infobg:rgba(29,78,216,.1);
  --display:"Michroma","Eurostile","Arial Black",sans-serif;--body:"Archivo","Helvetica Neue",Arial,sans-serif;--pad:clamp(14px,3vw,32px);--side:232px}
@media (prefers-color-scheme:dark){:root{--bg:#0A0A0A;--fg:#F2F2F2;--surface:#151515;--surface2:#1C1C1C;--muted:#A3A3A1;--line:rgba(255,255,255,.14);
  --ok:#4ade80;--okbg:rgba(74,222,128,.12);--warn:#fbbf24;--warnbg:rgba(251,191,36,.12);--bad:#f87171;--badbg:rgba(248,113,113,.12);--info:#93c5fd;--infobg:rgba(147,197,253,.12)}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){.logo-light{display:none}.logo-dark{display:block}}
h1,h2,h3{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:1.15}
h1{font-size:19px}h2{font-size:14px}h3{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font-weight:600;font-size:13.5px;border-radius:6px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{text-decoration:underline;font-weight:600}
.fld{display:block;margin-bottom:12px}
.fld>span,.lbl{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
.fld small,.help{display:block;color:var(--muted);font-size:12px;margin-top:5px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],input[type=tel],input[type=search],input[type=date],input[type=datetime-local],select,textarea{width:100%;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--fg)}
.err{color:var(--bad);font-size:13.5px;margin-top:6px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-new{color:var(--bad);background:var(--badbg)}.p-confirmed{color:var(--info);background:var(--infobg)}.p-out_for_delivery{color:var(--warn);background:var(--warnbg)}.p-delivered{color:var(--ok);background:var(--okbg)}.p-cancelled{color:var(--muted);background:var(--surface2)}
.p-preparing{color:var(--info);background:var(--infobg)}.p-returned,.p-refunded{color:var(--warn);background:var(--warnbg)}
.p-unpaid{color:var(--warn);background:var(--warnbg)}.p-paid{color:var(--ok);background:var(--okbg)}.p-refunded{color:var(--muted);background:var(--surface2)}
.p-active{color:var(--ok);background:var(--okbg)}.p-hidden{color:var(--muted);background:var(--surface2)}.p-scheduled{color:var(--info);background:var(--infobg)}.p-expired,.p-usedup,.p-off{color:var(--muted);background:var(--surface2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card+.card{margin-top:14px}
.card h2{margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:40px;font-size:12.5px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip b{margin-left:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{padding:7px 11px;font-size:12.5px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-box{width:min(360px,100%)}
.login-box img{height:28px;width:auto;margin-bottom:8px}
.login-box h1{font-size:13px;color:var(--muted);margin-bottom:26px}
.login-box .btn{width:100%;padding:12px}
.linkbtn{text-decoration:underline;font-size:13px;margin-top:14px;color:var(--muted)}
/* shell */
.shell{display:flex;min-height:100vh}
.side{width:var(--side);flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px}
.side .brand{display:flex;align-items:center;gap:8px;padding:4px 8px 18px}
.side .brand img{height:16px;width:auto}
.side .brand span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;text-decoration:none;font-weight:600;font-size:14px;color:var(--muted)}
.nav a:hover{background:var(--surface2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--surface2);color:var(--fg)}
.nav svg{width:18px;height:18px;flex-shrink:0}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:8px}
.badge{min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11.5px;display:inline-grid;place-items:center;font-weight:700}
.mainwrap{flex:1;min-width:0}
.mtop{display:none}
main{padding:22px var(--pad) 90px;max-width:1180px;margin:0 auto}
@media(max-width:959px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:70;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .mtop{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding:10px var(--pad);padding-top:max(10px,env(safe-area-inset-top))}
  .mtop img{height:15px;width:auto}
  .mtop .ttl{font-weight:700;margin-left:auto;font-size:13px;color:var(--muted)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60}
}
.menu-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.pagehead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.pagehead h1{margin-right:auto}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{max-width:280px}
.toolbar select,.pagehead select{width:auto}
/* tables */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tblwrap{overflow-x:auto;border-radius:10px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface2)}
.tbl .num{text-align:right;white-space:nowrap}
.thumb{width:40px;aspect-ratio:4/5;object-fit:cover;background:var(--studio);border-radius:4px}
.nowrap{white-space:nowrap}
.mlist{display:none;flex-direction:column;gap:8px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:3px 10px;text-align:left;width:100%}
.mcard .t{font-weight:700}.mcard .s{font-size:12.5px;color:var(--muted)}
@media(max-width:760px){.tblwrap.resp{display:none}.mlist{display:flex}}
.empty{padding:44px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
/* home */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.metric .k{font-size:12.5px;color:var(--muted);font-weight:600}
.metric .v{font-family:var(--display);font-size:20px;margin-top:6px}
.hgrid{display:grid;gap:14px}
@media(min-width:1000px){.hgrid{grid-template-columns:1.6fr 1fr}}
.chart svg{width:100%;height:190px;display:block}
.todo a{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600}
.todo a:last-child{border-bottom:0}
.todo .n{font-family:var(--display)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{word-break:break-word}
/* detail layout */
.dgrid{display:grid;gap:14px}
@media(min-width:1000px){.dgrid{grid-template-columns:1.55fr 1fr;align-items:start}}
.item{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.item img{width:48px;aspect-ratio:4/5;object-fit:cover;background:var(--studio);border-radius:4px}
.item .v{font-size:12.5px;color:var(--muted)}
.sumrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13.5px}
.sumrow.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:15px}
.feein{width:90px!important;padding:5px 8px!important;text-align:right}
.timeline{list-style:none;border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.timeline li{position:relative;padding:4px 0 10px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-20px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.timeline time{display:block;font-size:12px;color:var(--muted)}
/* product editor */
.colorbox{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.hexwrap{display:flex;gap:6px;align-items:center}
.hexwrap input[type=color]{width:40px;height:40px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
.hexwrap input[type=text]{width:96px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:4/5;background:var(--studio);border-radius:6px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .main{position:absolute;left:4px;top:4px;background:#000;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px}
.ph .tools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:rgba(0,0,0,.6)}
.ph .tools button{color:#fff;font-size:13px;padding:4px 7px}
.addph{aspect-ratio:4/5;border:1.5px dashed var(--line);border-radius:6px;display:grid;place-items:center;text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;padding:6px}
.addph input,.upl input{display:none}
.uploading{opacity:.5;pointer-events:none}
.stockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.stockgrid label{font-size:12px;font-weight:600}
.stockgrid input{margin-top:3px;padding:6px 8px!important}
.savebar{position:sticky;bottom:0;z-index:30;margin:18px calc(var(--pad)*-1) -90px;padding:12px var(--pad);padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
.savebar .err{margin:0 auto 0 0}
/* modal */
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:18px}
.modal h2{margin-bottom:14px}
/* store editor */
.se{display:grid;grid-template-columns:360px 1fr;gap:0;height:calc(100vh - 0px);margin:-22px calc(var(--pad)*-1) -90px}
.se-left{border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;height:100vh;position:sticky;top:0}
.se-head{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.se-status{font-size:12px;color:var(--muted)}
.acc{border-bottom:1px solid var(--line)}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;font-weight:700;font-size:13.5px;text-align:left}
.acc>button::after{content:"+";font-size:18px;color:var(--muted)}
.acc.open>button::after{content:"−"}
.acc .in{padding:4px 14px 14px;display:none}
.acc.open .in{display:block}
.imgpick{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;margin-bottom:12px}
.imgpick .pv{width:64px;height:64px;border-radius:6px;background:var(--studio) center/contain no-repeat;border:1px solid var(--line)}
.imgpick .pv.dark{background-color:#111}
.upl{display:inline-flex}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.se-right{background:var(--bg);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.se-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.se-frame{flex:1;display:grid;place-items:start center;overflow:auto;padding:14px}
.se-frame iframe{border:1px solid var(--line);border-radius:10px;background:#fff;width:100%;height:100%;min-height:600px;transition:width .25s}
.se-frame.phone iframe{width:390px;height:780px;flex:none}
.se-mtabs{display:none}
@media(max-width:959px){
  .se{grid-template-columns:1fr;height:auto;margin:-22px calc(var(--pad)*-1) -90px}
  .se-left,.se-right{height:calc(100vh - 57px);position:static}
  .se-mtabs{display:flex;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
  .se.show-preview .se-left{display:none}
  .se:not(.show-preview) .se-right{display:none}
  .se-frame.phone iframe,.se-frame iframe{width:100%;height:100%}
}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:95;transform:translate(-50%,160%);opacity:0;transition:transform .3s,opacity .25s;background:var(--fg);color:var(--bg);padding:11px 15px;border-radius:8px;font-weight:600;font-size:13.5px;max-width:calc(100% - 28px)}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast.bad{background:var(--bad);color:#fff}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<section class="login" id="vLogin" hidden>
  <div class="login-box">
    <img class="logo-light" src="/logo-word-black.png" alt="ACE"><img class="logo-dark" src="/logo-word-white.png" alt="ACE">
    <h1>Admin</h1>
    <div id="loginForm">
      <label class="fld"><span>Email</span><input type="email" id="lEmail" autocomplete="username" inputmode="email"></label>
      <label class="fld"><span>Password</span><input type="password" id="lPass" autocomplete="current-password"></label>
      <button class="btn" id="lBtn">Sign in</button>
      <div class="err" id="lErr" aria-live="polite"></div>
      <button class="linkbtn" id="forgotBtn">Forgot password?</button>
    </div>
    <div id="resetForm" hidden>
      <p class="muted" style="margin-bottom:14px">Choose a new password for your admin account.</p>
      <label class="fld"><span>New password</span><input type="password" id="rPass" autocomplete="new-password"></label>
      <button class="btn" id="rBtn">Save new password</button>
      <div class="err" id="rErr" aria-live="polite"></div>
    </div>
    <div id="notAdmin" hidden>
      <p style="margin-bottom:14px">This account isn't allowed into the ACE admin.</p>
      <button class="btn ghost" id="naOut">Sign out</button>
    </div>
  </div>
</section>

<div class="shell" id="vApp" hidden>
  <aside class="side" id="side">
    <div class="brand"><img class="logo-light" src="/logo-word-black.png" alt="ACE"><img class="logo-dark" src="/logo-word-white.png" alt="ACE"><span>Admin</span></div>
    <nav class="nav" id="nav">
      <a href="#/home" data-r="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
      <a href="#/orders" data-r="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16l-1.5 12.5a1 1 0 0 1-1 .9h-11a1 1 0 0 1-1-.9z"/><path d="M8 7a4 4 0 0 1 8 0"/></svg>Orders<span class="badge" id="navNew" hidden>0</span></a>
      <a href="#/products" data-r="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3l-5 4 3 3 2-1.5V21h8V8.5L18 10l3-3-5-4c0 2-2 3-4 3S8 5 8 3z"/></svg>Products</a>
      <a href="#/categories" data-r="categories" style="padding-left:38px;font-size:13px">Categories</a>
      <a href="#/customers" data-r="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Customers</a>
      <a href="#/discounts" data-r="discounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8" r="1.5"/></svg>Discounts</a>
      <a href="#/store" data-r="store"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M3 9h18"/></svg>Online store</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script>
/* =============== basics =============== */
const db=window.supabase.createClient(window.ACE_CONFIG.SUPABASE_URL,window.ACE_CONFIG.SUPABASE_KEY);
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>{const v=Math.round(Number(n||0)*100)/100;return(v<0?"−$":"$")+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})};
const STATUS=[["new","Submitted"],["confirmed","Confirmed"],["preparing","Preparing"],["out_for_delivery","Shipped"],["delivered","Delivered"],["cancelled","Cancelled"],["returned","Returned"],["refunded","Refunded"]];
const PTYPE={cash_on_delivery:"Cash on delivery",omt:"OMT",whish:"Whish",other:"Other"};
const REASONS={cancelled:["Customer cancelled","No answer from the customer","Fake or test order","Out of stock","Duplicate order","Wrong address / can't deliver","Other"],
  returned:["Customer refused at delivery","Wrong size","Damaged or defective","Not as expected","Other"]};
const PAY=[["unpaid","Unpaid"],["paid","Paid"],["refunded","Refunded"]];
const SL=Object.fromEntries(STATUS),PL=Object.fromEntries(PAY);
const NEXT={new:"confirmed",confirmed:"preparing",preparing:"out_for_delivery",out_for_delivery:"delivered",returned:"refunded"};
const NEXT_LABEL={new:"Confirm order",confirmed:"Start preparing",preparing:"Mark as shipped",out_for_delivery:"Mark delivered",returned:"Mark refunded"};
let CATEGORIES=[];
const catName=s=>(CATEGORIES.find(c=>c.slug===s)||{}).name||s;
const DAY=86400000;
let toastT;
function toast(msg,bad){const t=$("#toast");t.textContent=msg;t.classList.toggle("bad",!!bad);t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2800)}
const fmtDate=ts=>new Date(ts).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const fmtDT=ts=>new Date(ts).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function ago(ts){const s=(Date.now()-new Date(ts))/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";if(s<86400*6)return Math.floor(s/86400)+" d ago";return fmtDate(ts)}
function waNumber(phone,country){let d=String(phone||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if((country||"Lebanon")==="Lebanon"&&!d.startsWith("961")){d=d.replace(/^0/,"");if(d.length<=8)d="961"+d}return d}
const custKey=o=>{const d=String(o.phone||"").replace(/\D/g,"");return d.slice(-8)||("x"+(o.email||o.id))};
const pill=(k,label)=>`<span class="pill p-${k}">${esc(label)}</span>`;
function csv(rows,name){const s=rows.map(r=>r.map(v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function modal(html){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(m);m.addEventListener("click",e=>{if(e.target===m)m.remove()});return m}
function rangeStart(r){const n=new Date();if(r==="today"){n.setHours(0,0,0,0);return n}if(r==="all")return new Date(0);return new Date(Date.now()-Number(r)*DAY)}
function rangeSelect(id,val){return `<select id="${id}">${[["today","Today"],["7","Last 7 days"],["30","Last 30 days"],["90","Last 90 days"],["all","All time"]].map(([k,l])=>`<option value="${k}" ${k===val?"selected":""}>${l}</option>`).join("")}</select>`}

/* image upload (JPEG for photos, PNG keeps transparency for logos) */
function prepImage(file,max,png){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      const x=c.getContext("2d");if(!png){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("Couldn't read this photo")),png?"image/png":"image/jpeg",.86)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("This file isn't a photo we can read. Try a JPG or PNG."))};
    img.src=url;
  });
}
async function uploadImage(file,{max=1800,png=false}={}){
  const blob=await prepImage(file,max,png);
  const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${png?"png":"jpg"}`;
  const {error}=await db.storage.from("product-images").upload(path,blob,{contentType:png?"image/png":"image/jpeg",cacheControl:"31536000",upsert:false});
  if(error)throw error;
  return db.storage.from("product-images").getPublicUrl(path).data.publicUrl;
}

/* =============== data =============== */
let ORDERS=[],PRODUCTS=[],DISCOUNTS=[],SETTINGS={},ME="";
async function loadOrders(){const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false}).limit(2000);if(error)throw error;ORDERS=data||[];updateBadge();return ORDERS}
async function loadProducts(){const {data,error}=await db.from("products").select("*").order("position").order("created_at");if(error)throw error;PRODUCTS=data||[];return PRODUCTS}
async function loadCategories(){const {data,error}=await db.from("categories").select("*").order("position").order("created_at");if(error)throw error;CATEGORIES=data||[];return CATEGORIES}
async function loadDiscounts(){const {data,error}=await db.from("discounts").select("*").order("created_at",{ascending:false});if(error)throw error;DISCOUNTS=data||[];return DISCOUNTS}
async function loadSettings(){const {data,error}=await db.from("settings").select("key,value");if(error)throw error;SETTINGS=Object.fromEntries((data||[]).map(r=>[r.key,r.value]));return SETTINGS}
function updateBadge(){const n=ORDERS.filter(o=>o.status==="new").length;const b=$("#navNew");b.textContent=n;b.hidden=!n}
const live=o=>!["cancelled","returned","refunded"].includes(o.status);
const oTotal=o=>Number(o.total??o.subtotal??0);
function customers(){
  const m=new Map();
  [...ORDERS].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(o=>{
    const k=custKey(o);let c=m.get(k);
    if(!c){c={key:k,orders:[],spent:0,first:o.created_at,news:false};m.set(k,c)}
    c.orders.push(o);if(live(o))c.spent+=oTotal(o);c.last=o.created_at;c.news=c.news||o.news_opt_in;
    Object.assign(c,{name:`${o.first_name} ${o.last_name}`.trim(),phone:o.phone,email:o.email||c.email,city:o.city,country:o.country,company:o.company||c.company,
      address:[o.address1,o.address2,o.city,o.postal_code,o.country].filter(Boolean).join(", "),map:o.map_link||c.map});
  });
  return [...m.values()].sort((a,b)=>new Date(b.last)-new Date(a.last));
}

/* =============== auth =============== */
let booted=false,recovering=false;
function show(v){$("#vLogin").hidden=v!=="login";$("#vApp").hidden=v!=="app"}
function loginMode(m){$("#loginForm").hidden=m!=="login";$("#resetForm").hidden=m!=="reset";$("#notAdmin").hidden=m!=="notadmin"}
async function authRoute(session){
  if(recovering){show("login");loginMode("reset");return}
  if(!session){show("login");loginMode("login");return}
  const {data:ok,error}=await db.rpc("is_admin");
  if(error||!ok){show("login");loginMode("notadmin");return}
  ME=session.user.email;$("#whoami").textContent=ME;
  show("app");if(!booted){booted=true;boot()}
}
db.auth.onAuthStateChange((ev,session)=>{if(ev==="PASSWORD_RECOVERY")recovering=true;setTimeout(()=>authRoute(session),0)});
$("#lBtn").onclick=async()=>{
  const email=$("#lEmail").value.trim(),password=$("#lPass").value;$("#lErr").textContent="";
  if(!email||!password){$("#lErr").textContent="Enter your email and password.";return}
  $("#lBtn").disabled=true;const {error}=await db.auth.signInWithPassword({email,password});$("#lBtn").disabled=false;
  if(error)$("#lErr").textContent=/invalid/i.test(error.message)?"Wrong email or password.":error.message;
};
$("#lPass").addEventListener("keydown",e=>{if(e.key==="Enter")$("#lBtn").click()});
$("#forgotBtn").onclick=async()=>{const email=$("#lEmail").value.trim();if(!email){$("#lErr").textContent="Type your email above first, then tap Forgot password.";return}
  const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/admin"});$("#lErr").textContent=error?error.message:"Check your email for a link to set a new password."};
$("#rBtn").onclick=async()=>{const password=$("#rPass").value;if(password.length<8){$("#rErr").textContent="Use at least 8 characters.";return}
  const {error}=await db.auth.updateUser({password});if(error){$("#rErr").textContent=error.message;return}
  recovering=false;history.replaceState(null,"",location.pathname);toast("Password updated");const {data}=await db.auth.getSession();authRoute(data.session)};
$("#naOut").onclick=()=>db.auth.signOut();
$("#outBtn").onclick=()=>db.auth.signOut();
$("#menuBtn").onclick=()=>{$("#side").classList.add("open");$("#scrim").hidden=false};
$("#scrim").onclick=()=>{$("#side").classList.remove("open");$("#scrim").hidden=true};

/* =============== router =============== */
let leaveGuard=null;
const V=$("#view");
function go(h){location.hash=h}
async function router(){
  if(leaveGuard&&!leaveGuard())return;
  leaveGuard=null;
  const parts=(location.hash.replace(/^#\/?/,"")||"home").split("/");
  const r=parts[0];
  $$("#nav a").forEach(a=>a.setAttribute("aria-current",a.dataset.r===r?"page":"false"));
  $("#mTitle").textContent=({home:"Home",orders:"Orders",products:"Products",categories:"Categories",customers:"Customers",discounts:"Discounts",store:"Online store",settings:"Settings"})[r]||"";
  $("#side").classList.remove("open");$("#scrim").hidden=true;
  V.innerHTML=`<div class="empty" style="border:0;background:none"><span class="spin"></span></div>`;window.scrollTo(0,0);
  try{
    if(r==="home")await pHome();
    else if(r==="orders"&&parts[1])await pOrder(parts[1]);
    else if(r==="orders")await pOrders();
    else if(r==="products"&&parts[1])await pProduct(parts[1]);
    else if(r==="products")await pProducts();
    else if(r==="categories")await pCategories();
    else if(r==="customers"&&parts[1])await pCustomer(decodeURIComponent(parts[1]));
    else if(r==="customers")await pCustomers();
    else if(r==="discounts")await pDiscounts();
    else if(r==="store")await pStore();
    else if(r==="settings")await pSettings();
    else go("#/home");
  }catch(e){console.error(e);V.innerHTML=`<div class="empty">Something went wrong loading this page: ${esc(e.message||e)}<br><br><button class="btn ghost sm" onclick="router()">Try again</button></div>`}
}
addEventListener("hashchange",router);

/* =============== HOME =============== */
let homeRange="30";
async function pHome(){
  await Promise.all([loadOrders(),loadProducts()]);
  const from=rangeStart(homeRange);
  const inR=ORDERS.filter(o=>new Date(o.created_at)>=from);
  const L=inR.filter(live);
  const sales=L.reduce((a,o)=>a+oTotal(o),0);
  const items=L.reduce((a,o)=>a+(o.items||[]).reduce((b,i)=>b+Number(i.qty),0),0);
  const custs=new Set(L.map(custKey)).size;
  const allFirst=new Map();[...ORDERS].reverse().forEach(o=>{const k=custKey(o);if(!allFirst.has(k))allFirst.set(k,new Date(o.created_at))});
  const newC=[...new Set(L.map(custKey))].filter(k=>allFirst.get(k)>=from).length;
  // chart
  const days=homeRange==="today"?1:homeRange==="all"?Math.max(1,Math.min(180,Math.ceil((Date.now()-(ORDERS.length?new Date(ORDERS[ORDERS.length-1].created_at):Date.now()))/DAY)+1)):Number(homeRange);
  const buckets=[];const start=new Date();start.setHours(0,0,0,0);
  for(let i=days-1;i>=0;i--){const d=new Date(start.getTime()-i*DAY);buckets.push({d,v:0})}
  L.forEach(o=>{const d=new Date(o.created_at);d.setHours(0,0,0,0);const b=buckets.find(x=>x.d.getTime()===d.getTime());if(b)b.v+=oTotal(o)});
  const max=Math.max(1,...buckets.map(b=>b.v));const W=700,H=170,bw=W/buckets.length;
  const bars=buckets.map((b,i)=>{const h=Math.round((b.v/max)*(H-24));return `<rect x="${(i*bw+bw*.15).toFixed(1)}" y="${H-h}" width="${(bw*.7).toFixed(1)}" height="${Math.max(h,b.v?2:0)}" rx="2" fill="currentColor"><title>${b.d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}: ${money(b.v)}</title></rect>`}).join("");
  const lbl=(i)=>buckets[i]?buckets[i].d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"";
  // top products
  const tp={};L.forEach(o=>(o.items||[]).forEach(i=>{const k=i.name;tp[k]=tp[k]||{name:i.name,image:i.image,qty:0,rev:0};tp[k].qty+=Number(i.qty);tp[k].rev+=Number(i.qty)*Number(i.price)}));
  const top=Object.values(tp).sort((a,b)=>b.qty-a.qty).slice(0,5);
  // to do
  const toConfirm=ORDERS.filter(o=>o.status==="new").length;
  const toShip=ORDERS.filter(o=>["confirmed","preparing","out_for_delivery"].includes(o.status)).length;
  const unpaid=ORDERS.filter(o=>o.status==="delivered"&&o.payment_status==="unpaid").length;
  let low=0,out=0;PRODUCTS.forEach(p=>(p.colors||[]).forEach(c=>Object.values(c.stock||{}).forEach(v=>{if(v===""||v==null)return;v=Number(v);if(v<=0)out++;else if(v<=3)low++})));
  V.innerHTML=`
  <div class="pagehead"><h1>Home</h1>${rangeSelect("hRange",homeRange)}</div>
  <div class="metrics">
    <div class="metric"><div class="k">Total sales</div><div class="v">${money(sales)}</div></div>
    <div class="metric"><div class="k">Orders</div><div class="v">${L.length}</div></div>
    <div class="metric"><div class="k">Average order</div><div class="v">${money(L.length?sales/L.length:0)}</div></div>
    <div class="metric"><div class="k">Items sold</div><div class="v">${items}</div></div>
    <div class="metric"><div class="k">Customers</div><div class="v">${custs}</div><div class="muted" style="font-size:12px;margin-top:3px">${newC} new</div></div>
  </div>
  <div class="hgrid">
    <div>
      <div class="card chart"><h2>Sales over time</h2>
        <svg viewBox="0 0 ${W} ${H+18}" preserveAspectRatio="none" role="img" aria-label="Daily sales chart">${bars}
          <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="currentColor" stroke-opacity=".2"/></svg>
        <div class="row between muted" style="font-size:12px;margin-top:4px"><span>${lbl(0)}</span><span>${lbl(buckets.length-1)}</span></div>
      </div>
      <div class="card"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">Recent orders</h2><a class="link" href="#/orders" style="font-size:13px">View all</a></div>
        ${ORDERS.slice(0,6).map(o=>`<a href="#/orders/${o.order_number}" class="row between" style="text-decoration:none;padding:9px 0;border-bottom:1px solid var(--line)"><span><b>#${o.order_number}</b> <span class="muted">· ${esc(o.first_name)} ${esc(o.last_name)} · ${ago(o.created_at)}</span></span><span class="row">${pill(o.status,SL[o.status])}<b>${money(oTotal(o))}</b></span></a>`).join("")||`<p class="muted">No orders yet.</p>`}
      </div>
    </div>
    <div>
      <div class="card todo"><h2>To do</h2>
        <a href="#/orders?f=new"><span>Orders to confirm</span><span class="n">${toConfirm}</span></a>
        <a href="#/orders?f=confirmed"><span>Orders to deliver</span><span class="n">${toShip}</span></a>
        <a href="#/orders?f=unpaid"><span>Delivered but not marked paid</span><span class="n">${unpaid}</span></a>
        <a href="#/products"><span>Sizes low in stock (3 or less)</span><span class="n">${low}</span></a>
        <a href="#/products"><span>Sizes out of stock</span><span class="n">${out}</span></a>
      </div>
      <div class="card"><h2>Top products</h2>
        ${top.map(t=>`<div class="item">${t.image?`<img src="${esc(t.image)}" alt="">`:"<span></span>"}<div><div><b>${esc(t.name)}</b></div><div class="v">${t.qty} sold</div></div><div>${money(t.rev)}</div></div>`).join("")||`<p class="muted">Sales will show here.</p>`}
      </div>
    </div>
  </div>`;
  $("#hRange").onchange=e=>{homeRange=e.target.value;pHome()};
}

/* =============== ORDERS =============== */
let oF={status:"all",pay:"all",range:"all",q:""};
async function pOrders(){
  const qp=new URLSearchParams((location.hash.split("?")[1])||"");
  if(qp.get("f")){const f=qp.get("f");if(f==="unpaid"){oF.status="delivered";oF.pay="unpaid"}else{oF.status=f;oF.pay="all"}history.replaceState(null,"","#/orders")}
  await loadOrders();
  V.innerHTML=`<div class="pagehead"><h1>Orders</h1><button class="btn ghost sm" id="oExport">Export CSV</button><button class="btn ghost sm" id="oRefresh">Refresh</button></div>
    <div class="chips" id="oChips" style="margin-bottom:10px"></div>
    <div class="toolbar"><input type="search" id="oQ" placeholder="Search order #, name, phone, city" value="${esc(oF.q)}">
      <select id="oPay"><option value="all">All payments</option>${PAY.map(([k,l])=>`<option value="${k}" ${oF.pay===k?"selected":""}>${l}</option>`).join("")}</select>
      ${rangeSelect("oRange",oF.range)}</div>
    <div id="oOut"></div>`;
  const draw=()=>{
    const from=rangeStart(oF.range);const q=oF.q.trim().toLowerCase().replace(/^#/,"");
    const base=ORDERS.filter(o=>new Date(o.created_at)>=from&&(oF.pay==="all"||o.payment_status===oF.pay)&&(!q||[o.order_number,o.first_name,o.last_name,o.phone,o.city,o.email].join(" ").toLowerCase().includes(q)));
    const counts={all:base.length};STATUS.forEach(([k])=>counts[k]=base.filter(o=>o.status===k).length);
    $("#oChips").innerHTML=[["all","All"],...STATUS].map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${oF.status===k}">${l}<b>${counts[k]}</b></button>`).join("");
    $$("#oChips .chip").forEach(c=>c.onclick=()=>{oF.status=c.dataset.f;draw()});
    const list=base.filter(o=>oF.status==="all"||o.status===oF.status);
    if(!list.length){$("#oOut").innerHTML=`<div class="empty">${ORDERS.length?"No orders match.":"No orders yet. They'll appear here as soon as customers check out."}</div>`;return}

function mailStatus(o,pre){
  const s=o[pre+"_status"]||"skipped";
  if(s==="sent")return `<span class="pill p-paid">Sent</span> <span class="muted" style="font-size:12px">${o[pre+"_sent_at"]?fmtDT(o[pre+"_sent_at"]):""}</span>`;
  if(s==="failed")return `<span class="pill p-new">Failed</span>`;
  if(s==="pending"||s==="sending")return `<span class="pill p-unpaid">Sending</span>`;
  return `<span class="pill p-cancelled">Not sent</span>`;
}
async function callNotify(payload){
  try{const {data}=await db.auth.getSession();const tok=data.session&&data.session.access_token;
    const r=await fetch("/api/order-notify",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify(payload)});
    const j=await r.json().catch(()=>({}));return r.ok?{ok:true,...j}:{ok:false,error:j.error||("Error "+r.status)}}
  catch(e){return{ok:false,error:e.message||String(e)}}
}
function statusDialog(o,s,run){
  const needReason=s==="cancelled"||s==="returned";
  const askRestock=["cancelled","returned","refunded"].includes(s)&&!o.restocked_at;
  const askPaid=s==="delivered"&&(o.payment_status||"unpaid")==="unpaid";
  const askAmount=s==="refunded"||s==="returned";
  if(!needReason&&!askRestock&&!askPaid&&!askAmount){
    if(["delivered","new"].includes(s)&&!confirm(`Mark order #${o.order_number} as ${SL[s]}?`))return;
    run({});return;
  }
  const total=oTotal(o);
  const m=modal(`<h2>Mark #${o.order_number} as ${esc(SL[s])}</h2>
    ${needReason?`<label class="fld"><span>Reason</span><select id="sdReason"><option value="">Choose a reason…</option>${REASONS[s].map(r=>`<option>${esc(r)}</option>`).join("")}</select></label>`:""}
    ${askAmount?`<label class="fld"><span>Amount refunded to the customer ($)</span><input type="number" id="sdAmt" min="0" max="${total}" step="0.01" value="${total}"><small>Full order total is ${money(total)}. Lower it for a partial refund.</small></label>`:""}
    <label class="fld"><span>Note (optional)</span><input type="text" id="sdNote" maxlength="300"></label>
    ${askRestock?`<label class="toggle" style="margin-bottom:10px"><input type="checkbox" id="sdRestock" ${s==="refunded"?"":"checked"}> Put the items back in stock</label>`:""}
    ${askPaid?`<label class="toggle" style="margin-bottom:10px"><input type="checkbox" id="sdPaid" ${o.payment_type==="cash_on_delivery"||!o.payment_type?"checked":""}> Payment received (mark as paid)</label>`:""}
    <div class="err" id="sdErr"></div>
    <div class="row between" style="margin-top:12px"><button class="btn ghost" id="sdCancel">Back</button><button class="btn" id="sdGo">Confirm</button></div>`);
  $("#sdCancel",m).onclick=()=>m.remove();
  $("#sdGo",m).onclick=async()=>{
    const reason=needReason?$("#sdReason",m).value:null;if(needReason&&!reason){$("#sdErr",m).textContent="Choose a reason.";return}
    const args={p_reason:reason,p_note:$("#sdNote",m).value||null};
    if(askRestock)args.p_restock=$("#sdRestock",m).checked;
    if(askPaid)args.p_mark_paid=$("#sdPaid",m).checked;
    if(askAmount){const a=parseFloat($("#sdAmt",m).value);if(!(a>=0)){$("#sdErr",m).textContent="Enter the refunded amount.";return}args.p_refund_amount=a}
    $("#sdGo",m).disabled=true;const ok=await run(args);if(ok)m.remove();else $("#sdGo",m).disabled=false;
  };
}
function attrHtml(o){
  const a=o.attribution||{},f=a.first_touch||{},l=a.last_touch||{};
  const src=x=>[x.utm_source||x.source,x.utm_medium].filter(Boolean).join(" / ");
  const has=o.utm_source||o.fbclid||o.referrer||f.landing_page||l.utm_source||l.source;

  const row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:"";

    ${row("Instagram/FB click",o.fbclid?"Yes (fbclid)":"")}${row("First visit from",src(f)&&src(f)!==src(l)?src(f)+(f.utm_campaign?" · "+f.utm_campaign:""):"")}

/* =============== DISCOUNTS =============== */
function dState(d){const n=new Date();if(!d.active)return["off","Off"];if(d.starts_at&&new Date(d.starts_at)>n)return["scheduled","Scheduled"];if(d.ends_at&&new Date(d.ends_at)<n)return["expired","Expired"];if(d.usage_limit!=null&&d.used_count>=d.usage_limit)return["usedup","Used up"];return["active","Active"]}
async function pDiscounts(){
  await loadDiscounts();
  V.innerHTML=`<div class="pagehead"><h1>Discounts</h1><button class="btn sm" id="dNew">Create discount</button></div><div id="dOut"></div>
    <p class="help" style="margin-top:10px">Customers type the code at checkout. The discount is checked and applied by the database, so it can't be faked.</p>`;
  const out=$("#dOut");
  if(!DISCOUNTS.length)out.innerHTML=`<div class="empty">No discount codes yet. Create one, e.g. WELCOME10 for 10% off.</div>`;
  else out.innerHTML=`<div class="tblwrap"><table class="tbl"><thead><tr><th>Code</th><th>Discount</th><th>Status</th><th>Used</th><th>Minimum</th><th>Dates</th></tr></thead><tbody>
    ${DISCOUNTS.map(d=>{const [k,l]=dState(d);return `<tr data-id="${d.id}"><td><b>${esc(d.code)}</b></td><td>${d.kind==="percent"?`${Number(d.value)}% off`:`${money(d.value)} off`}</td><td>${pill(k,l)}</td><td>${d.used_count}${d.usage_limit!=null?` / ${d.usage_limit}`:""}</td><td>${Number(d.min_subtotal)>0?money(d.min_subtotal):"None"}</td><td class="muted nowrap" style="font-size:12.5px">${d.starts_at?fmtDate(d.starts_at):"Now"} → ${d.ends_at?fmtDate(d.ends_at):"No end"}</td></tr>`}).join("")}
    </tbody></table></div>`;
  $$("#dOut [data-id]").forEach(r=>r.onclick=()=>editDiscount(DISCOUNTS.find(d=>d.id===r.dataset.id)));
  $("#dNew").onclick=()=>editDiscount(null);
}
function editDiscount(d){
  const toLocal=ts=>ts?new Date(new Date(ts).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):"";
  const m=modal(`<h2>${d?"Edit discount":"Create discount"}</h2>
    <label class="fld"><span>Code</span><div class="row" style="flex-wrap:nowrap"><input type="text" id="dCode" value="${esc(d?d.code:"")}" maxlength="40" style="text-transform:uppercase" placeholder="WELCOME10"><button class="btn ghost sm" id="dGen" type="button">Generate</button></div></label>
    <div class="grid2"><label class="fld"><span>Type</span><select id="dKind"><option value="percent" ${!d||d.kind==="percent"?"selected":""}>Percentage</option><option value="fixed" ${d&&d.kind==="fixed"?"selected":""}>Fixed amount ($)</option></select></label>
      <label class="fld"><span>Value</span><input type="number" id="dVal" min="0" step="0.01" value="${d?Number(d.value):""}"></label></div>
    <div class="grid2"><label class="fld"><span>Minimum order ($)</span><input type="number" id="dMin" min="0" step="0.01" value="${d?Number(d.min_subtotal):0}"></label>
      <label class="fld"><span>Total uses allowed</span><input type="number" id="dLim" min="1" step="1" value="${d&&d.usage_limit!=null?d.usage_limit:""}" placeholder="Unlimited"></label></div>
    <div class="grid2"><label class="fld"><span>Starts</span><input type="datetime-local" id="dStart" value="${toLocal(d&&d.starts_at)}"></label>
      <label class="fld"><span>Ends</span><input type="datetime-local" id="dEnd" value="${toLocal(d&&d.ends_at)}"></label></div>
    <label class="toggle" style="margin:6px 0 14px"><input type="checkbox" id="dAct" ${!d||d.active?"checked":""}> Active</label>
    ${d?`<p class="help" style="margin-bottom:12px">Used ${d.used_count} time${d.used_count===1?"":"s"}.</p>`:""}
    <div class="err" id="dErr"></div>
    <div class="row between" style="margin-top:10px">${d?`<button class="btn danger sm" id="dDel">Delete</button>`:"<span></span>"}<span class="row"><button class="btn ghost" id="dCancel">Cancel</button><button class="btn" id="dSave">Save</button></span></div>`);
  $("#dCancel",m).onclick=()=>m.remove();
  $("#dGen",m).onclick=()=>{$("#dCode",m).value="ACE"+Math.random().toString(36).slice(2,7).toUpperCase()};
  $("#dSave",m).onclick=async()=>{
    const e=t=>{$("#dErr",m).textContent=t};
    const code=$("#dCode",m).value.trim().toUpperCase().replace(/\s+/g,""),val=parseFloat($("#dVal",m).value),kind=$("#dKind",m).value;
    if(code.length<2)return e("Add a code (at least 2 characters).");if(!(val>0))return e("Add a value above 0.");if(kind==="percent"&&val>100)return e("A percentage can't be over 100.");
    const lim=$("#dLim",m).value.trim();const s=$("#dStart",m).value,en=$("#dEnd",m).value;
    const row={code,kind,value:val,min_subtotal:Math.max(0,parseFloat($("#dMin",m).value)||0),usage_limit:lim?Math.max(1,parseInt(lim)):null,active:$("#dAct",m).checked,starts_at:s?new Date(s).toISOString():null,ends_at:en?new Date(en).toISOString():null};
    const res=d?await db.from("discounts").update(row).eq("id",d.id):await db.from("discounts").insert(row);
    if(res.error)return e(/duplicate|unique/i.test(res.error.message)?"That code already exists.":"Couldn't save: "+res.error.message);
    m.remove();toast("Discount saved");pDiscounts();
  };
  if(d)$("#dDel",m).onclick=async()=>{if(!confirm(`Delete ${d.code}?`))return;const {error}=await db.from("discounts").delete().eq("id",d.id);if(error)return toast(error.message,true);m.remove();toast("Discount deleted");pDiscounts()};
}

    <div class="card" style="margin-top:22px"><h2>Server events</h2>
      <p class="help" style="margin:-4px 0 10px">Events sent from the server (GA4 refunds now, Meta in the next phase). Failed ones retry automatically.</p>
      <div id="evList" class="muted" style="font-size:13px">Loading…</div>
      <button class="btn ghost sm" id="evRun" style="margin-top:10px">Send waiting events now</button>
    </div>
    <div class="card"><h2>Order emails</h2>
      <p class="help" style="margin:-4px 0 10px">Every new order is emailed to you, and the customer gets a confirmation email. Use this button to check it works. It sends a sample email and doesn't create an order.</p>
      <button class="btn ghost sm" id="sTestMail">Send a test email</button><span class="help" id="sTestMsg" style="display:inline;margin-left:8px"></span>
    </div>
    <div class="card"><h2>Staff</h2>
      <p class="help" style="margin:-4px 0 10px">People who can open this admin. They also need a login: in Supabase, Authentication, Users, Add user, with the same email.</p>
      ${(admins||[]).map(a=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(a.email)}${a.email.toLowerCase()===ME.toLowerCase()?' <span class="muted">(you)</span>':""}</span>${a.email.toLowerCase()===ME.toLowerCase()?"":`<button class="btn danger sm" data-rmadmin="${esc(a.email)}">Remove</button>`}</div>`).join("")}
      <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input type="email" id="sNewAdmin" placeholder="email@example.com"><button class="btn ghost sm" id="sAddAdmin">Add</button></div>
    </div>
    <div class="card"><h2>Your password</h2><div class="row" style="flex-wrap:nowrap"><input type="password" id="sPass" placeholder="New password (8+ characters)" autocomplete="new-password"><button class="btn ghost sm" id="sPassBtn">Change</button></div></div>
  </div>`;
  $("#sSave").onclick=async()=>{
    const wa=$("#sWa").value.replace(/\D/g,""),ig=$("#sIg").value.trim(),fee=$("#sFee").value.trim(),free=$("#sFree").value.trim();$("#sErr").textContent="";
    if(wa&&wa.length<8)return $("#sErr").textContent="That WhatsApp number looks too short. Include the country code.";
    if(ig&&!/^https?:\/\//i.test(ig))return $("#sErr").textContent="The Instagram link should start with https://";
    const ga=$("#sGa").value.trim().toUpperCase(),ph=$("#sPh").value.trim();
    if(ga&&!/^G-[A-Z0-9]{4,}$/.test(ga))return $("#sErr").textContent="The GA4 Measurement ID should look like G-XXXXXXXXXX.";
    if(ph&&!/^phc_[A-Za-z0-9]{10,}$/.test(ph))return $("#sErr").textContent="The PostHog key should start with phc_.";
    const rows=[["ga4_measurement_id",ga],["posthog_key",ph],["posthog_region",$("#sPhR").value],["whatsapp_number",wa],["instagram_url",ig],["delivery_fee",fee],["free_delivery_over",free],["delivery_text",$("#sDt").value.trim()],["payment_text",$("#sPt").value.trim()]].map(([key,value])=>({key,value}));
    const {error}=await db.from("settings").upsert(rows);if(error)return $("#sErr").textContent="Couldn't save: "+error.message;toast("Settings saved");
  };
  $$("[data-rmadmin]").forEach(b=>b.onclick=async()=>{if(!confirm(`Remove ${b.dataset.rmadmin} from the admin?`))return;const {error}=await db.from("admins").delete().eq("email",b.dataset.rmadmin);if(error)return toast(error.message,true);toast("Removed");pSettings()});
  $("#sAddAdmin").onclick=async()=>{const e=$("#sNewAdmin").value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return toast("Type a valid email",true);const {error}=await db.from("admins").insert({email:e});if(error)return toast(/duplicate/i.test(error.message)?"Already on the list":error.message,true);toast("Added");pSettings()};
  const loadEv=async()=>{const {data,error}=await db.from("conversion_events").select("*").order("id",{ascending:false}).limit(15);
    const el=$("#evList");if(error){el.textContent="Couldn't load: "+error.message;return}
    if(!data||!data.length){el.textContent="No server events yet. They appear when orders are cancelled, returned or refunded.";return}
    const pl={sent:"p-paid",failed:"p-new",pending:"p-unpaid",sending:"p-unpaid",skipped:"p-cancelled"};
    el.innerHTML=data.map(e=>`<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--line)"><span><b>${esc(e.destination.toUpperCase())}</b> ${esc(e.event_name)} · #${e.order_number||""} <span class="muted">${fmtDT(e.created_at)}</span>${e.last_response?`<br><span class="muted" style="font-size:12px">${esc(e.last_response)}</span>`:""}</span><span class="pill ${pl[e.status]||""}">${esc(e.status)}${e.attempts>1?" ×"+e.attempts:""}</span></div>`).join("")};
  loadEv();
  $("#evRun").onclick=async()=>{const b=$("#evRun");b.disabled=true;try{const {data}=await db.auth.getSession();const r=await fetch("/api/conversions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+(data.session&&data.session.access_token)},body:"{}"});
    const j=await r.json().catch(()=>({}));toast(r.ok?`Done: ${j.sent||0} sent, ${j.failed||0} failed, ${j.skipped||0} skipped`:"Error: "+(j.error||r.status),!r.ok)}catch(e){toast(e.message,true)}b.disabled=false;loadEv()};
  $("#sTestMail").onclick=async()=>{const b=$("#sTestMail");b.disabled=true;$("#sTestMsg").textContent="Sending…";const r=await callNotify({action:"test"});b.disabled=false;
    $("#sTestMsg").textContent=r.ok?"Sent. Check your inbox (and spam folder).":"Failed: "+(r.error||"unknown error");$("#sTestMsg").style.color=r.ok?"":"var(--bad)"};
  $("#sPassBtn").onclick=async()=>{const p=$("#sPass").value;if(p.length<8)return toast("Use at least 8 characters",true);const {error}=await db.auth.updateUser({password:p});if(error)return toast(error.message,true);$("#sPass").value="";toast("Password changed")};
}

/* =============== boot =============== */
function boot(){
  router();
  setInterval(async()=>{if(document.hidden)return;try{const before=ORDERS.length?ORDERS[0].id:null;await loadOrders();const r=location.hash.replace(/^#\/?/,"").split("/")[0]||"home";
    if(ORDERS.length&&ORDERS[0].id!==before&&before!==null){toast("New order received");if(r==="home"||(r==="orders"&&!location.hash.split("/")[2]))router()}}catch(e){}},30000);
}
db.auth.getSession().then(({data})=>authRoute(data.session));
</script>
</body>
</html>
